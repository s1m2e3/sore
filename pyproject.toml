[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "enriched-ontology-matching"
version = "2.0.0"
description = "Five-step ontology matching pipeline scoring four orthogonal dimensions: lexical, WL-structural, graph-shape (degree/spectral/clustering/betweenness), and attribute-reach similarity"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "nltk",
    "requests",
    "sentence-transformers",
    "torch",
    "plotly",
    "scikit-learn",
]

[project.scripts]
eom-run     = "enriched_ontology_matching.run_all_pairs:main"
eom-compare = "enriched_ontology_matching.compare_stage:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enriched_ontology_matching*"]

[tool.setuptools.package-data]
enriched_ontology_matching = [
    "inputs/**/*.json",
    "tools/**/*",
]
